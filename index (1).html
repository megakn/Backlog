<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel SVC · SD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0E2A47;--navy2:#1E3A5F;--teal:#0E7C86;--bg:#EEF2F7;--muted:#65748A;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Inter',Segoe UI,Arial,sans-serif;}
  .topo{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 10px rgba(14,42,71,.25);position:relative;z-index:2}
  .marca{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
  .marca small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  .marca b{font-size:16px;font-weight:800}
  .abas{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
  .abas button{border:none;background:transparent;color:#fff;font:800 13px 'Inter',sans-serif;padding:9px 16px;border-radius:9px;cursor:pointer;opacity:.8;white-space:nowrap}
  .abas button.on{background:#fff;color:var(--navy);opacity:1}
  .area{position:absolute;top:56px;left:0;right:0;bottom:0;display:flex}
  iframe{border:none;height:100%;background:var(--bg)}
  #fCoord{flex:1;width:100%}
  #fLider{width:100%}
  .area.lado #fLider{width:480px;flex:0 0 480px;border-left:2px solid #CBD5E1;box-shadow:-4px 0 14px rgba(14,42,71,.08)}
  .area.so-coord #fLider{display:none}
  .area.so-lider #fCoord{display:none}
  .area.so-lider #fLider{flex:1}
  @media(max-width:900px){.abas button[data-v="lado"]{display:none} .marca small{display:none}}
  @media(max-width:560px){.topo{padding:0 8px;gap:6px} .marca b{font-size:13px} .abas button{padding:8px 10px;font-size:12px}}
</style>
</head>
<body>
<div class="topo">
  <div class="marca"><small>Kuehne+Nagel · Meli</small><b>Painel SVC · SD</b></div>
  <div class="abas">
    <button data-v="coord" onclick="ver('coord')">🗂 Coordenação</button>
    <button data-v="lider" onclick="ver('lider')">📱 Líder de Rua</button>
    <button data-v="lado" onclick="ver('lado')">⇆ Lado a lado</button>
  </div>
</div>
<div class="area so-coord" id="area">
  <iframe id="fCoord" title="Coordenação"></iframe>
  <iframe id="fLider" title="Líder de Rua"></iframe>
</div>

function abrir(id,b64){ const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); document.getElementById(id).srcdoc=new TextDecoder('utf-8').decode(bytes); }
abrir('fCoord',APP_COORD); abrir('fLider',APP_LIDER);
function ver(v){
  document.getElementById('area').className='area '+(v==='coord'?'so-coord':v==='lider'?'so-lider':'lado');
  document.querySelectorAll('.abas button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  try{localStorage.setItem('painel-svc-aba',v)}catch(e){}
}
let inicial='coord'; try{inicial=localStorage.getItem('painel-svc-aba')||'coord'}catch(e){}
if(inicial==='lado' && window.innerWidth<900) inicial='coord';
ver(inicial);
</script>
